# The companion app on Fly.io: one always-on machine in the personal org, beside Supabase
# (us-east-2, Ohio). DATABASE_URL and SUPABASE_URL are Fly secrets. See app/README.md.
app = "gradebreaker"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
