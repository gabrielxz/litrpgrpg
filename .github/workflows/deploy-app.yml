# Deploys the companion app to Fly.io (the personal org's `gradebreaker` app) when app code,
# rules data, or the deploy files change on main. Book-only commits do not deploy. The deploy
# waits until nobody is connected, so a push mid-session does not drop the table; a manual run
# can force it.
name: Deploy the companion app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "rules/**"
      - "Dockerfile"
      - ".dockerignore"
      - "fly.toml"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even while people are connected
        type: boolean
        default: false

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pip install pyyaml
      - name: The TypeScript engine has every Python engine function
        run: python3 app/packages/engine/scripts/signatures.py | diff -u app/packages/engine/src/signatures.ts -
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm -r typecheck && pnpm -r test
        working-directory: app

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Wait until nobody is connected
        if: ${{ !inputs.force }}
        run: |
          for i in $(seq 1 120); do
            n=$(curl -sf https://gradebreaker.fly.dev/api/health | jq -r '.connected // 0' || echo 0)
            if [ "$n" = "0" ]; then echo "Nobody connected."; exit 0; fi
            echo "$n connected; checking again in a minute."
            sleep 60
          done
          echo "People stayed connected for two hours; run the workflow by hand with force to deploy anyway."
          exit 1
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
