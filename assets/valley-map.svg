<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1500" viewBox="0 0 1950 1500">
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#000" stroke-width="2.5"/>
    </pattern>
    <pattern id="stipple" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.6" fill="#000"/>
      <circle cx="13" cy="12" r="1.3" fill="#000"/>
      <circle cx="9" cy="16" r="1.1" fill="#000"/>
    </pattern>
  </defs>

  <rect width="1950" height="1500" fill="#ffffff"/>

  <!-- ======= the wall of light (far end, beyond the north rim) ======= -->
  <rect x="60" y="55" width="1830" height="70" fill="url(#hatch)" stroke="#000" stroke-width="3"/>
  <text x="975" y="170" font-family="serif" font-size="30" letter-spacing="6" text-anchor="middle" fill="#000">THE WALL OF LIGHT &#183; STANDS PAST THE FAR RIM UNTIL PHASE 5</text>

  <!-- ======= rim contours (landing slopes) ======= -->
  <g fill="none" stroke="#000">
    <ellipse cx="975" cy="800" rx="830" ry="560" stroke-width="4"/>
    <ellipse cx="978" cy="803" rx="795" ry="528" stroke-width="1.5" transform="rotate(1.2 978 803)"/>
    <ellipse cx="972" cy="798" rx="755" ry="497" stroke-width="1.5" transform="rotate(-1.5 972 798)"/>
    <ellipse cx="976" cy="801" rx="715" ry="466" stroke-width="1" stroke-dasharray="10 7" transform="rotate(0.8 976 801)"/>
  </g>
  <g font-family="serif" font-size="26" letter-spacing="4" fill="#000">
    <text x="975" y="292" text-anchor="middle" transform="rotate(-2 975 292)">LANDING SLOPES</text>
    <text x="975" y="1330" text-anchor="middle" transform="rotate(1.5 975 1330)">LANDING SLOPES</text>
    <text x="240" y="810" text-anchor="middle" transform="rotate(-78 240 810)">LANDING SLOPES</text>
    <text x="1712" y="810" text-anchor="middle" transform="rotate(78 1712 810)">LANDING SLOPES</text>
  </g>

  <!-- ======= the rain line (dashed, between the node and the north sector) ======= -->
  <path d="M 640 585 Q 975 520 1310 585" fill="none" stroke="#000" stroke-width="3.5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <text x="1355" y="580" font-family="serif" font-size="24" font-style="italic" fill="#000">the rain line</text>

  <!-- ======= MARTIAL REMNANT (north): tiered bowl ======= -->
  <g fill="none" stroke="#000" stroke-width="2.5">
    <ellipse cx="965" cy="430" rx="120" ry="58"/>
    <ellipse cx="965" cy="432" rx="90" ry="42"/>
    <ellipse cx="965" cy="434" rx="60" ry="27"/>
    <ellipse cx="965" cy="436" rx="30" ry="13"/>
  </g>
  <text x="965" y="352" font-family="serif" font-size="30" letter-spacing="5" text-anchor="middle" fill="#000">MARTIAL REMNANT</text>

  <!-- ======= WILD FRAGMENT (east): trees ======= -->
  <g stroke="#000" stroke-width="2.2" fill="none">
    <path d="M1450 760 l14 -40 l14 40 z M1464 760 v22"/>
    <path d="M1500 720 l16 -46 l16 46 z M1516 720 v26"/>
    <path d="M1548 780 l14 -40 l14 40 z M1562 780 v22"/>
    <path d="M1500 812 l15 -42 l15 42 z M1515 812 v24"/>
    <path d="M1445 842 l13 -36 l13 36 z M1458 842 v20"/>
    <path d="M1552 858 l13 -36 l13 36 z M1565 858 v20"/>
    <path d="M1596 730 l13 -36 l13 36 z M1609 730 v20"/>
  </g>
  <text x="1530" y="925" font-family="serif" font-size="30" letter-spacing="5" text-anchor="middle" fill="#000">WILD FRAGMENT</text>

  <!-- ======= ARCANE DEBRIS (west): tower in hanging pieces ======= -->
  <g stroke="#000" stroke-width="2.5" fill="#fff">
    <rect x="395" y="800" width="90" height="52"/>
    <rect x="405" y="726" width="72" height="40" transform="rotate(-9 441 746)"/>
    <rect x="418" y="668" width="56" height="32" transform="rotate(12 446 684)"/>
    <rect x="428" y="620" width="40" height="24" transform="rotate(-16 448 632)"/>
    <rect x="437" y="584" width="26" height="16" transform="rotate(20 450 592)"/>
  </g>
  <text x="443" y="905" font-family="serif" font-size="30" letter-spacing="5" text-anchor="middle" fill="#000">ARCANE DEBRIS</text>

  <!-- ======= CIVIC FRAGMENT (south): building with windows ======= -->
  <g stroke="#000" stroke-width="2.5" fill="#fff">
    <rect x="880" y="1130" width="190" height="84"/>
    <rect x="898" y="1146" width="20" height="14" fill="#000"/>
    <rect x="934" y="1146" width="20" height="14" fill="#fff"/>
    <rect x="970" y="1146" width="20" height="14" fill="#000"/>
    <rect x="1006" y="1146" width="20" height="14" fill="#fff"/>
    <rect x="898" y="1178" width="20" height="14" fill="#fff"/>
    <rect x="934" y="1178" width="20" height="14" fill="#000"/>
    <rect x="970" y="1178" width="20" height="14" fill="#fff"/>
    <rect x="1006" y="1178" width="20" height="14" fill="#000"/>
  </g>
  <text x="975" y="1262" font-family="serif" font-size="30" letter-spacing="5" text-anchor="middle" fill="#000">CIVIC FRAGMENT</text>

  <!-- ======= THE BRIGHT GROUND (stipple field, west of centre) ======= -->
  <ellipse cx="800" cy="805" rx="185" ry="105" fill="url(#stipple)" stroke="#000" stroke-width="1.5" stroke-dasharray="2 8"/>
  <text x="783" y="935" font-family="serif" font-size="24" font-style="italic" text-anchor="middle" fill="#000">the bright ground</text>

  <!-- ======= TRANSIT NEXUS (true centre): broken ring ======= -->
  <g stroke="#000" fill="none">
    <path d="M 838 780 A 42 42 0 1 1 872 822" stroke-width="5"/>
    <path d="M 866 745 A 42 42 0 0 1 880 762" stroke-width="5"/>
    <line x1="843" y1="827" x2="833" y2="843" stroke-width="3"/>
    <line x1="874" y1="833" x2="884" y2="847" stroke-width="3"/>
  </g>
  <text x="852" y="676" font-family="serif" font-size="28" letter-spacing="4" text-anchor="middle" fill="#000">TRANSIT NEXUS</text>

  <!-- ======= causeway from the node to the nexus ======= -->
  <g stroke="#000" stroke-width="2">
    <line x1="905" y1="812" x2="1010" y2="852"/>
    <line x1="908" y1="798" x2="1015" y2="838"/>
  </g>
  <text x="962" y="893" font-family="serif" font-size="22" font-style="italic" fill="#000" text-anchor="middle">the causeway</text>

  <!-- ======= THE RECYCLING NODE: a mound of everything ======= -->
  <g stroke="#000" stroke-width="2.5" fill="#fff">
    <path d="M 1010 900 Q 1035 838 1075 848 Q 1092 826 1118 840 Q 1150 828 1162 862 Q 1190 872 1178 900 Z"/>
    <path d="M 1040 878 l18 -8 M 1075 862 l16 6 M 1108 856 l14 -7 M 1135 872 l15 4" stroke-width="1.8"/>
  </g>
  <text x="1098" y="948" font-family="serif" font-size="28" letter-spacing="4" text-anchor="middle" fill="#000">THE RECYCLING NODE</text>

  <!-- ======= THE RUSTED COLOSSUS (south-east, lying down) ======= -->
  <g transform="rotate(-24 1330 1045)">
    <rect x="1230" y="1020" width="200" height="50" rx="25" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <line x1="1258" y1="1020" x2="1258" y2="1070" stroke="#000" stroke-width="1.5"/>
    <line x1="1298" y1="1020" x2="1298" y2="1070" stroke="#000" stroke-width="1.5"/>
    <line x1="1338" y1="1020" x2="1338" y2="1070" stroke="#000" stroke-width="1.5"/>
    <line x1="1378" y1="1020" x2="1378" y2="1070" stroke="#000" stroke-width="1.5"/>
  </g>
  <text x="1355" y="1130" font-family="serif" font-size="24" font-style="italic" text-anchor="middle" fill="#000">the rusted colossus</text>

  <!-- ======= hanging stones ======= -->
  <g stroke="#000" stroke-width="2" fill="#fff">
    <path d="M 690 460 l22 -10 l16 14 l-12 16 l-22 -4 z"/>
    <path d="M 745 420 l16 -8 l12 11 l-9 12 l-17 -3 z"/>
    <path d="M 640 505 l14 -7 l11 9 l-8 11 l-15 -3 z"/>
    <line x1="700" y1="486" x2="700" y2="497" stroke-width="1"/>
    <line x1="755" y1="440" x2="755" y2="449" stroke-width="1"/>
  </g>
  <text x="700" y="540" font-family="serif" font-size="22" font-style="italic" text-anchor="middle" fill="#000">hanging stones</text>

  <!-- ======= compass ======= -->
  <g transform="translate(1760 235)">
    <line x1="0" y1="38" x2="0" y2="-38" stroke="#000" stroke-width="2.5"/>
    <path d="M 0 -38 l-10 20 l10 -6 l10 6 z" fill="#000"/>
    <text x="0" y="-50" font-family="serif" font-size="30" text-anchor="middle" fill="#000">N</text>
  </g>

  <!-- ======= key ======= -->
  <g font-family="serif" fill="#000">
    <rect x="80" y="1160" width="545" height="250" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="105" y="1205" font-size="26" letter-spacing="4">THE TUTORIAL VALLEY</text>
    <line x1="105" y1="1220" x2="485" y2="1220" stroke="#000" stroke-width="1.5"/>
    <text x="105" y="1256" font-size="23">Phase 2 &#183; one landing apiece, on the slopes</text>
    <text x="105" y="1290" font-size="23">Phase 3 &#183; the Recycling Node</text>
    <text x="105" y="1324" font-size="23">Phase 4 &#183; two of the four sectors</text>
    <text x="105" y="1358" font-size="23">Phase 5 &#183; the causeway to the nexus</text>
    <text x="105" y="1394" font-size="22" font-style="italic">Rim to rim, about a mile. North is up.</text>
  </g>
</svg>
