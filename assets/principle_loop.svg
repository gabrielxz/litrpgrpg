<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1500" height="1500" fill="#ffffff"/>

  <!-- loop-back line: from THE GRANT left edge, up the left margin, into LIVE HARD -->
  <path d="M 280 1300 L 150 1300 L 150 200 L 268 200" fill="none" stroke="#1a1a1a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="112" y="750" font-family="DejaVu Serif" font-style="italic" font-size="28" fill="#333333" text-anchor="middle" transform="rotate(-90 112 750)">then live it deeper</text>

  <!-- Stage 1: LIVE HARD -->
  <rect x="280" y="120" width="620" height="160" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
  <text x="590" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="48" fill="#1a1a1a" text-anchor="middle">LIVE HARD</text>
  <text x="590" y="245" font-family="DejaVu Sans" font-size="30" fill="#333333" text-anchor="middle">fight, risk, survive</text>

  <!-- arrow 1 -> 2 -->
  <line x1="590" y1="280" x2="590" y2="385" stroke="#1a1a1a" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Stage 2: BATTLE MEMORY -->
  <rect x="280" y="395" width="620" height="160" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
  <text x="590" y="465" font-family="DejaVu Sans" font-weight="bold" font-size="48" fill="#1a1a1a" text-anchor="middle">BATTLE MEMORY</text>
  <text x="590" y="520" font-family="DejaVu Sans" font-size="30" fill="#333333" text-anchor="middle">the System keeps your worst moments</text>
  <line x1="900" y1="475" x2="960" y2="475" stroke="#555555" stroke-width="3" stroke-dasharray="3,7"/>
  <rect x="960" y="446" width="420" height="58" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="2"/>
  <text x="982" y="485" font-family="DejaVu Sans Mono" font-size="25" fill="#1a1a1a">[Battle Memory recorded.]</text>

  <!-- arrow 2 -> 3 -->
  <line x1="590" y1="555" x2="590" y2="660" stroke="#1a1a1a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="622" y="618" font-family="DejaVu Serif" font-style="italic" font-size="28" fill="#333333">meditate on it during Consolidation</text>

  <!-- Stage 3: INSIGHT POINTS -->
  <rect x="280" y="670" width="620" height="160" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
  <text x="590" y="740" font-family="DejaVu Sans" font-weight="bold" font-size="48" fill="#1a1a1a" text-anchor="middle">INSIGHT POINTS</text>
  <text x="590" y="795" font-family="DejaVu Sans" font-size="30" fill="#333333" text-anchor="middle">understanding, counted</text>
  <line x1="900" y1="750" x2="960" y2="750" stroke="#555555" stroke-width="3" stroke-dasharray="3,7"/>
  <rect x="960" y="721" width="480" height="58" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="2"/>
  <text x="982" y="760" font-family="DejaVu Sans Mono" font-size="25" fill="#1a1a1a">[Insight Gained: Weight 8/10]</text>

  <!-- arrow 3 -> 4 -->
  <line x1="590" y1="830" x2="590" y2="935" stroke="#1a1a1a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="622" y="893" font-family="DejaVu Serif" font-style="italic" font-size="28" fill="#333333">at 3 / 10 / 25 / 50 / 100 IP</text>

  <!-- Stage 4: DISTILLATION -->
  <rect x="280" y="945" width="620" height="160" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
  <text x="590" y="1015" font-family="DejaVu Sans" font-weight="bold" font-size="48" fill="#1a1a1a" text-anchor="middle">DISTILLATION</text>
  <text x="590" y="1070" font-family="DejaVu Sans" font-size="30" fill="#333333" text-anchor="middle">say the truth you have learned</text>

  <!-- arrow 4 -> 5 -->
  <line x1="590" y1="1105" x2="590" y2="1210" stroke="#1a1a1a" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Stage 5: THE GRANT -->
  <rect x="280" y="1220" width="620" height="160" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
  <text x="590" y="1290" font-family="DejaVu Sans" font-weight="bold" font-size="48" fill="#1a1a1a" text-anchor="middle">THE GRANT</text>
  <text x="590" y="1345" font-family="DejaVu Sans" font-size="30" fill="#333333" text-anchor="middle">Application, Infusion, or Domain</text>
  <line x1="900" y1="1300" x2="960" y2="1300" stroke="#555555" stroke-width="3" stroke-dasharray="3,7"/>
  <rect x="960" y="1271" width="500" height="58" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="2"/>
  <text x="982" y="1310" font-family="DejaVu Sans Mono" font-size="25" fill="#1a1a1a">[Seed attained: Sudden Weight.]</text>
</svg>
