---
title: "Gradebreaker"
subtitle: "The LitRPG RPG"
author: "Gabriel Beal"
date: "Working Draft"

# Title page — uses the title-baked cover (built by ImageMagick) as full-bleed
# background. Title and byline are rendered into the image itself, so PDF and
# EPUB share an identical cover treatment.
titlepage: true
titlepage-background: "build/cover_titled.png"
titlepage-text-color: "F5F5F5"
titlepage-rule-color: "00000000"   # transparent rule
titlepage-rule-height: 0
toc-own-page: true
book: true
classoption:
  - oneside
  - 11pt

# Page geometry — 7x10 trim with comfortable inner margin
geometry:
  - paperwidth=7in
  - paperheight=10in
  - inner=0.85in
  - outer=0.7in
  - top=0.85in
  - bottom=0.9in
  - headsep=0.3in

fontsize: 11pt

# Fonts, through the template's own variables. A \setmainfont in the preamble
# is overridden by Eisvogel's default Source Sans block, which comes later.
mainfont: "EBGaramond"
mainfontoptions:
  - Extension=.otf
  - UprightFont=*-Regular
  - ItalicFont=*-Italic
  - BoldFont=*-Bold
  - BoldItalicFont=*-BoldItalic
sansfont: "AlegreyaSans"
sansfontoptions:
  - Extension=.otf
  - UprightFont=*-Regular
  - ItalicFont=*-Italic
  - BoldFont=*-Bold
  - BoldItalicFont=*-BoldItalic
monofont: "JetBrainsMono"
monofontoptions:
  - Extension=.otf
  - UprightFont=*-Regular
  - ItalicFont=*-Italic
  - BoldFont=*-Bold
  - BoldItalicFont=*-BoldItalic
  - Scale=0.82
linestretch: 1.18

# Headings & numbering
numbersections: true
toc-depth: 2
secnumdepth: 2   # number chapters, sections, subsections; deeper headings stay unnumbered

# Code & listings
listings-disable-line-numbers: true
listings-no-page-break: true
code-block-font-size: \scriptsize
caption-justification: centering

# Misc
links-as-notes: false
colorlinks: true
linkcolor: black
urlcolor: "5B7C99"
toccolor: black

# Running header / footer.
# Eisvogel's defaults are title (header-left), date (header-right), author
# (footer-left) and page (footer-right). Its template tests each slot with
# $if(...)$, and pandoc reads an empty string as false, so "" does not clear a
# slot: it falls through to the default. Blank a slot with \hspace{0pt},
# which is truthy to the template and prints nothing.
header-left: "\\leftmark"        # current chapter name (set by \chaptermark)
header-center: ""
header-right: "\\hspace{0pt}"    # blank; the page number lives in the footer
footer-left: "\\hspace{0pt}"     # blank; the author belongs on the title page
footer-center: ""
footer-right: "\\thepage"        # page number, outer corner
---
