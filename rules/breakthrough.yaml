# Grade Breakthroughs.
# source: 30-breakthroughs.md

requirement: Grade-cap level (25 at F, 50 at E, 75 at D)
stages: [Preparation, Ignition, Trial, Recognition]
trial_time_box_minutes: 10

check:
  formula: d100 + HRT Force + preparation vs Breakthrough DC
  dc: 140                         # Severe, flat, no Cross-Grade Adjustment, every transition
  volatility: true                # explodes at the character's current Grade threshold
  saturation_penalties_apply: false   # the ignition burns the VE as fuel

# The multiple of Tolerance held at Ignition. Minimum one Tolerance.
overcharge:
  - {ratio: 1, label: Minimum,    saturation: None,           dc_modifier: 0,  quality_tiers: 0}
  - {ratio: 2, label: Aggressive, saturation: "Mild, −10",    dc_modifier: 10, quality_tiers: 1}
  - {ratio: 3, label: Reckless,   saturation: "Heavy, −25",   dc_modifier: 20, quality_tiers: 2}
  - {ratio: 4, label: Suicidal,   saturation: "Critical, clock running", dc_modifier: 40, quality_tiers: 3}
overcharge_ve_at_f_cap: [80, 160, 240, 320]   # Tolerance × ratio; ×10 per Grade above

modifiers:
  - {source: Location Energy Density,     min: 0, max: 25}
  - {source: Foundation Pills consumed,   min: 5, max: 15}
  - {source: HVE Coherence Bonus,         min: 0, max: 20}
  - {source: Party Support,               min: 5, max: 15}
  - {source: Quality Enhancer item,       roll_modifier: none, effect: raises the final tier one step}
  - {source: Tribulation Ward,            roll_modifier: none, effect: upgrades Cracked to Stable}
phenomenon_penalty_per_breach: -10     # each external threat that reaches the cultivator
anchor:
  one_per_breakthrough: true
  roll: Opposed Roll with HRT, POW, or FOR Force vs Moderate of the current Grade
  bonus_on_success: 5
  bonus_at_margin_20: 10
  bonus_at_margin_40: 15

# Coherence is read from the Deep rows of the HVE sheet (hve.yaml holds the band thresholds).
coherence_bonus:
  Scattered: 0
  Leaning: 5
  Defined: 10
  Singular: 20

quality_tiers:
  - {tier: Cracked,      margin_min: null, margin_max: -1, description: Failure.}
  - {tier: Stable,       margin_min: 0,    margin_max: 19, description: Standard ascension.}
  - {tier: Polished,     margin_min: 20,   margin_max: 39, description: Above-average ascension.}
  - {tier: Pristine,     margin_min: 40,   margin_max: 59, description: Exceptional ascension.}
  - {tier: Transcendent, margin_min: 60,   margin_max: null, description: One-of-a-kind ascension.}
tier_adjustment:
  overcharge_steps: [0, 1, 2, 3]        # by ratio ×1/×2/×3/×4, success only
  quality_enhancer_steps: 1
  never_above: Transcendent
  failure_stays_cracked: true

energy_density:
  - {tier: Barren,   bonus: 0,  phenomena: "Minimal (1 weak threat)",                      examples: "Urban ruins, depleted zones, mundane terrain"}
  - {tier: Low,      bonus: 5,  phenomena: "Light (1 moderate threat)",                    examples: "Wilderness with scattered energy, minor ley lines"}
  - {tier: Moderate, bonus: 10, phenomena: "Standard (2 moderate threats)",                examples: "Established energy nexus, active ley-line intersection"}
  - {tier: High,     bonus: 20, phenomena: "Heavy (2–3 strong threats)",                   examples: "Deep dungeon core, natural treasure ground, ancient formation"}
  - {tier: Extreme,  bonus: 25, phenomena: "Severe (3 strong threats, possible Grade+ entity)", examples: "Mystic realm convergence point, heart of an Incursion zone"}

item_categories:
  - {category: Foundation Pills,      function: Raise base success odds on the Breakthrough Check., examples: "Dragon Marrow Pill (+5), Nine Leaf Essence (+10), Heavenly Foundation Pill (+15)"}
  - {category: Resonance Catalysts,   function: Amplify Principle gains during the trial. Increase IP awarded at Stable or higher., examples: "Principle Tuning Crystal, Resonance Elixir"}
  - {category: Anchoring Artifacts,   function: Reduce backlash damage to self and party if the Breakthrough fails or external phenomena break through., examples: "Stillwater Ward Stone, Earthbound Anchor Talisman"}
  - {category: Tribulation Wards,     function: The insurance policy. If consumed, upgrades a Cracked result to Stable. Consumed whether used or not. Extremely rare., examples: "Phoenix Down Seal, Heavenly Tribulation Banner"}
  - {category: Quality Enhancers,     function: Push the final Quality Tier up by one step (never above Transcendent)., examples: "Celestial Refinement Crystal, Dao Clarification Lotus"}
  - {category: Bespoke Items,         function: Rare, themed effects that do not fit the other categories., examples: "Heart Demon Mirror, Phoenix Feather, Spatial Anchor Stone"}
item_stacking: one item per category; Bespoke Items adjudicated case by case

outputs:
  Stable:
    grade_advances: true
    stat_caps_rise: true
    stats_multiplied: false
    class_evolution_options: [1, 3]
    class_infusion_points_at_e: [50, 100]
    f_to_e_unlocks_second_principle_slot: true
    e_to_d_opens_domain_gate: true
  Polished:
    class_infusion_points_at_e: [75, 150]   # increased by half; extra points by HVE mapping
  Pristine:
    bespoke_perk: true
    principle_ip_bonus: 10
  Transcendent:
    unique_reward: [Bloodline Awakening, Unique Skill, Hidden Title, Principle Revelation]
    hidden_achievement: true

failure:
  always_grants_battle_memory: true
  ve_backlash: all stored VE burned; none becomes level progress
  by_transition:
    F->E:
      stat_loss: FOR and POW each −5 (minimum 1), temporary; recovered by one full Consolidation
      lockout_sessions: 2
      permanent: false
    E->D:
      aether_ceiling: Max Aether reduced by one tenth (drop fractions) until the next successful Breakthrough
      principle_regression: lose IP equal to half the current total toward the highest Principle; tier kept
      lockout_sessions: 3
      cracked_foundation_penalty: -5
      stat_loss: FOR and POW each lose one twentieth of current Raw (fractions dropped), permanent until recovered
    D->C:
      lockout_sessions: 4
      note: future supplement
