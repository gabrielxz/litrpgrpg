# The rules version. Bump the minor number when a number or table changes,
# the major number when a procedure changes. Campaigns record the version
# they started under and migrate when their GM says so.
version: "0.1.35"
dated: "2026-09-29"
notes: >
  First extraction from the book as of build litrpg-rpg-20260910-223335:
  flat-value VE (Tolerance 80, level 120, 20 per hour), the Grade Gap Rule,
  run modes by name. 0.1.1: sub-Grade kills pay 0. 0.1.2: the tutorial's
  nine unique titles added under tutorial_titles. 0.1.3: Thin Margin and
  Not Recommended reclassed from Hidden Achievement to Achievement (they pay
  +1; the Hidden Achievement guide is +3 to +5). 0.1.4: the firearms row in the
  weapon table (Pistol / Rifle / Shotgun, DEX, firearms, 1d10 rounds when found).
  0.1.5: Surge costs half Maximum Aether rounded down, minimum 1; Consolidation healing
  rounds up; structured logging computes the sweep instead of a separate numeric vector;
  Salvaged and Came Back Whole (+1 HRT) join tutorial_titles; the Warden turns Hostile at
  143 HP or less; the Wraith's PER exception; faction consequences stated in words.
  0.1.6: Momentum is rolled on the higher of HRT and PER Force (Initial and Seize); a creature
  printing neither uses its higher printed Force. Heart's every-fight job. 0.1.7: every stat block
  prints HRT and PER Force (Momentum, searching, mental defense); the printed-Force fallback is gone.
  0.1.8: a Stable or better Breakthrough adds 10 to every Attribute (×10 per Grade), the caps lifted and
  no floor imposed. 0.1.9: the class package (classes.yaml): selection adds 10 to the lead Attribute (the
  5 to 10 range is retired), three profile shapes, one technique at 5 Aether or a frequency gate or a
  drawback, one permission, the guarded list; an Application's world quantities scale ×10 per Grade of
  the body. 0.1.10: the encounter sizing rows from Level 8 up are written in creature Force (standard 40 / 50 / 60 /
  70 at L8–12 / 13–17 / 18–22 / 23–25, easy 10 less, hard 10 more; a second creature counts as 20 Force), calibrated
  by tools/class_sim.py; Hold Fast takes the Frequency shape; Make Do yields Healing Pills up to the Healing Pill and
  Scavenged Field Gear only. 0.1.11: Take It cuts the Margin by 40 (from 20), declared before the ally's Yield.
  0.1.12: After the Gate lands: the four Imprint blocks in the Bestiary (Interceptor 25 / Bearer 45 / Cordon 60 /
  Completion 75), and an Accession Rift pays the Faction column at its difficulty. 0.1.13: the Rift award reaches the
  Quick Reference and the kit's VE block (25 / 50 / 90 / 150 at Moderate / Hard / Severe / Peak, per character, plus the
  kills), with the clearance rule beside it. No number moved; the Quick Reference VE table gained a row.
  0.1.14 (the Core Mechanics read-through): every d100 roll explodes; two kinds of roll, the Clash (against a
  roller) and the check (against a Resistance; the Breakthrough's DC is Resistance 140); Take 100 and one roll per
  check until something changes; Advantage (two d100, keep the higher, about +20) replaces the Positional States,
  Exposed stays at −10 and Flanking at +10; Backgrounds replace non-combat Proficiencies (one weapon Proficiency at
  creation; Marks come from an exploding weapon roll); the Will Save is d100 + HRT Force against Moderate 90 calm /
  Hard 115 flaring; the Grade table shows the stat cap, Force, and damage for all six Grades; Consolidation healing is a
  fifth an hour with the fifth hour restoring the rest (no rounding exception); a collapse at the Level cap lasts 5
  hours; pills are Grade-locked both ways; the Grade Reference Card is the Difficulty Card.
  0.1.15 (the forward-chapter sweep, applied before Gabriel's read reaches those chapters): a d100 read against
  an effect table does not explode; the Reactive Buckler is once between Consolidations in the data; Anchoring
  Artifacts halve a Cracked result's stat loss and make a threat that reaches the cultivator −5; the density table
  lists Easy / Moderate / Hard threats; class evolution offers three options; High and Extreme density refine 40 VE
  an hour; a collapsed character wakes at Tolerance or below; quest failure against refusal stated by type;
  Frenzy Rat HRT 05; the Volatile Shard and Battered Communicator have stated procedures; skill synthesis caps at +20
  and costs Aether at the highest source Grade; the HVE's world-response and adversarial lists cover all eight poles.
  0.1.16: at most one class per campaign carries a guarded power; the Kindler's poles are Force and Freedom; a boss
  already at Peak drops one meaningful item plus two bespoke drops; the app's 0.5 HVE entries are sweep reminders and
  add nothing unless the GM raises one to a full tally.
  0.1.17: no rule caps guarded powers; the book advises great care (one in a campaign is plenty), and the app and the
  AI-Assisted prompt offer one only when the GM asks.
  0.1.18: party size. The encounter sizing table is written for four characters; each character fewer or more
  shifts a fight one column easier or harder, which from Level 8 is 10 Force per character and at Levels 1 to 7 in a
  group is one creature of the lowest tier fewer or more (tested by simulation for three to five). The tutorial
  names four and scales the Node's loot and the causeway queue.
  0.1.19 (the Character Creation read-through): no Proficiency at creation. The first Mark with a weapon shape grants
  its Proficiency at Trained, the third makes it Seasoned, the tenth (with an E-Grade body) Master, the same for every
  weapon; the 3-Mark grant for a new shape is retired. The pregens start untrained, and the combat sim's Level 1 party
  is untrained (the Bestiary's two Level 1 figures moved). Stat anchors: FOR 10 climbs Everest without bottled oxygen,
  POW 10's lights flicker when they lose their temper. "Multiverse" is retired for "universe".
  0.1.20: the Frenzy Rat is Trivial (one Beat, Off 06, Def 08, PER 08, HP 12), and the tutorial's treeline arrival is
  one rat. The pair downed a lone Level 1 character in 87% of arrivals in simulation, against about 15% for the other
  arrivals; one Trivial rat downs 17%. The arrival kill pays 2 VE for every arrival.
  0.1.21: questions the companion app forced. Before crystallization IP can sit in two families; the first to reach 3
  crystallizes and the rest stays banked toward the E-Grade slot; the threshold rule reads "after crystallization". The
  family-level report is the Resonance notice (Affinity Notice retired). A Battle Memory is processed at a Consolidation of
  the player's choosing. Once-per-Consolidation effects reset at the first full hour, with artifacts and Aether. A
  Consolidation counts as completed (Deep Breather) once its first full hour is done. Cultivation's pill line names
  Healing Pills (two of each kind, per Items). The Personal Opportunity template drops "slight HVE shift". The reference
  engine's structured sweep counts a 0.5 entry as nothing unless raised to 1.0, matching the book since 0.1.16.
  0.1.22: book answers the companion app forced. Session survival VE is cut (quest VE guarantees the baseline; the tutorial's
  guaranteed awards are about 220, Session 1 pays 12 to 42, and After the Gate's second and third waves assume 130 and 190).
  "System points" are assigned points. The pill limit is 5 of each kind per Consolidation, every pill counting in a fight or
  out of one (per_consolidation_limit_per_kind; the per-fight limit and the ten quiet minutes are retired). A Seize tie rolls
  again; a surprised defender may Yield; vital coherence counts the round of Downing as the first; stabilizing needs the same
  Zone on both paths, and bare hands is a DEX check. Collapse: an hour of Consolidation that refines VE does not count toward
  the clock, and the collapse's own Consolidation does not return the temporary point. "Once a day" runs dawn to dawn. The
  loot rows carry their chances as fields, a boss's 1.5× rounds down, the interface lists what the character carries, the
  Achievement catalog carries counter and threshold fields, and a quest pays its stated award to every holder, nothing to one
  above the quest's Grade.
  0.1.23: the table's clock reads dawn at 06:00 (classes.yaml dawn_hour), which the GM may move where the party is; the
  companion app's in-game clock reads it. The book sentence is queued.
  0.1.24: classes.yaml carries each class's System notice, the Level 10 opening line, and the offer's heading
  (the book's boxes, held word for word by the prose lint), and marks the two once-a-day permissions (Finder's Share,
  Standing). No number moved; the companion app offers the book's classes as written.
  0.1.25: titles.yaml carries What Can Be Seen's Grade-gap table as data (inspection: resolves from a gap of 0, hidden
  Bestowed titles from 2, unrevealed Hidden Achievements from 3), with the engine's inspection_resolves and title_readable
  and the table's rows as fixtures. No number moved.
  0.1.26: the encounter sizing rows carry their cells as data (levels; mix at Levels 1 to 7, force from Level 8), held to
  the rendered text by the prose lint, and the engine sizes a fight: creature_sizing_force (the higher of Offense and
  Defense), encounter_force (a second creature counts as 20; a third is a RulesGap), encounter_column_force and
  encounter_column_mix (one column per character from four). No number moved.
  0.1.27: tutorial.yaml holds the tutorial as a content pack (the System notices the GM delivers by hand, the four quest
  boxes, and the fights by phase), each notice paragraph and quest held to the chapter by the prose lint. The companion
  app loads it into Prep. No number moved.
  0.1.28: assigned points bound for a stat at the Grade cap are lost, whether the GM places them or a class profile does;
  nothing redirects them (Gabriel). Free points still go elsewhere. The Progression sentence is queued for the book.
  0.1.29: a class technique may carry a hook the companion app applies (a Clash bonus on a named side, or a heal with a
  reach) and names its drawback; Triage, Breach, Pay in Blood, and Sworn Blow carry theirs. No number moved.
  0.1.30: a quest's count may be marked as one that cannot scale (Quests, "Quest sharing": reach a place, protect a
  person, recover a thing), and sharing leaves it as written; the tutorial's Sector Survey (Q-002) is marked. No
  number moved.
  0.1.31: the numbers both engines stated in code move into the data: Max HP per Raw FOR (character.yaml
  derived.max_hp_per_raw_for: 2), the Surge cost's divisor and minimum (combat.yaml surge.cost_divisor: 2,
  cost_minimum: 1), and the Anchor's bonus by Margin as rows (breakthrough.yaml anchor.bonus_by_margin). No number moved.
  0.1.32: the System AI chapter's sample vision joins the data (system-ai.yaml, Battle Memory Visions
  example), for the app's vision drafter, and voice.rules is written one rule to an item (the flow list
  split "never persuades, apologizes, or encourages" at its commas). No number moved.
  0.1.33: each Behavioral Stat Mapping row names its HVE side (character.yaml behavioral_stat_mapping side),
  the eight rows being the eight sides in the axes' order (Gabriel, 2026-09-29). No number moved.
  0.1.34: the Consolidation vision comes at most once a day, dawn to dawn (principles.yaml
  consolidation_vision_per_day: 1); visions.max_per_session is retired, and no rule counts sessions (Gabriel,
  2026-09-27). The Behavioral Stat Mapping table renders a Side column, and What Can Be Seen's inspection table
  renders from titles.yaml inspection. integration-summary.txt is the Tutorial's Summary Template verbatim, and the
  prose lint holds it and the pregens' taglines, Backgrounds, and playing notes to the book. The System's quest
  register sample pays a fixed 30 VE. The book takes the queued app rulings of 0.1.23 to 0.1.33.
  0.1.35: each creature past the second counts as 10 Force (bestiary.yaml encounter_guidance
  further_creature_worth_force: 10; tools/class_sim.py, Levels 10 to 25, one to four creatures), and
  encounter_force sizes any number. Class offers: the template drops "prefer powers that make the player
  declare something" and carries the rulings (two of three offers work in most fights, no busywork,
  healing in a fight or between rests); a class never adds to what a rest restores (Classes, Guardrails).
  The Battle Memory Visions prompt joins the templates (templates/battle-memory-vision.txt).
