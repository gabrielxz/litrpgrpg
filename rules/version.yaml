# The rules version. Bump the minor number when a number or table changes,
# the major number when a procedure changes. Campaigns record the version
# they started under and migrate when their GM says so.
version: "0.1.17"
dated: "2026-09-24"
notes: >
  First extraction from the book as of build litrpg-rpg-20260910-223335:
  flat-value VE (Tolerance 80, level 120, 20 per hour), the Grade Gap Rule,
  run modes by name. 0.1.1: sub-Grade kills pay 0. 0.1.2: the tutorial's
  nine unique titles added under tutorial_titles. 0.1.3: Thin Margin and
  Not Recommended reclassed from Hidden Achievement to Achievement (they pay
  +1; the Hidden Achievement guide is +3 to +5). 0.1.4: the firearms row in the
  weapon table (Pistol / Rifle / Shotgun, DEX, firearms, 1d10 rounds when found).
  0.1.5: Surge costs half Maximum Aether rounded down, minimum 1; Consolidation healing
  rounds up; structured logging computes the sweep instead of a separate numeric vector;
  Salvaged and Came Back Whole (+1 HRT) join tutorial_titles; the Warden turns Hostile at
  143 HP or less; the Wraith's PER exception; faction consequences stated in words.
  0.1.6: Momentum is rolled on the higher of HRT and PER Force (Initial and Seize); a creature
  printing neither uses its higher printed Force. Heart's every-fight job. 0.1.7: every stat block
  prints HRT and PER Force (Momentum, searching, mental defense); the printed-Force fallback is gone.
  0.1.8: a Stable or better Breakthrough adds 10 to every Attribute (×10 per Grade), the caps lifted and
  no floor imposed. 0.1.9: the class package (classes.yaml): selection adds 10 to the lead Attribute (the
  5 to 10 range is retired), three profile shapes, one technique at 5 Aether or a frequency gate or a
  drawback, one permission, the guarded list; an Application's world quantities scale ×10 per Grade of
  the body. 0.1.10: the encounter sizing rows from Level 8 up are written in creature Force (standard 40 / 50 / 60 /
  70 at L8–12 / 13–17 / 18–22 / 23–25, easy 10 less, hard 10 more; a second creature counts as 20 Force), calibrated
  by tools/class_sim.py; Hold Fast takes the Frequency shape; Make Do yields Healing Pills up to the Healing Pill and
  Scavenged Field Gear only. 0.1.11: Take It cuts the Margin by 40 (from 20), declared before the ally's Yield.
  0.1.12: After the Gate lands: the four Imprint blocks in the Bestiary (Interceptor 25 / Bearer 45 / Cordon 60 /
  Completion 75), and an Accession Rift pays the Faction column at its difficulty. 0.1.13: the Rift award reaches the
  Quick Reference and the kit's VE block (25 / 50 / 90 / 150 at Moderate / Hard / Severe / Peak, per character, plus the
  kills), with the clearance rule beside it. No number moved; the Quick Reference VE table gained a row.
  0.1.14 (the Core Mechanics read-through): every d100 roll explodes; two kinds of roll, the Clash (against a
  roller) and the check (against a Resistance; the Breakthrough's DC is Resistance 140); Take 100 and one roll per
  check until something changes; Advantage (two d100, keep the higher, about +20) replaces the Positional States,
  Exposed stays at −10 and Flanking at +10; Backgrounds replace non-combat Proficiencies (one weapon Proficiency at
  creation; Marks come from an exploding weapon roll); the Will Save is d100 + HRT Force against Moderate 90 calm /
  Hard 115 flaring; the Grade table shows the stat cap, Force, and damage for all six Grades; Consolidation healing is a
  fifth an hour with the fifth hour restoring the rest (no rounding exception); a collapse at the Level cap lasts 5
  hours; pills are Grade-locked both ways; the Grade Reference Card is the Difficulty Card.
  0.1.15 (the forward-chapter sweep, applied before Gabriel's read reaches those chapters): a d100 read against
  an effect table does not explode; the Reactive Buckler is once between Consolidations in the data; Anchoring
  Artifacts halve a Cracked result's stat loss and make a threat that reaches the cultivator −5; the density table
  lists Easy / Moderate / Hard threats; class evolution offers three options; High and Extreme density refine 40 VE
  an hour; a collapsed character wakes at Tolerance or below; quest failure against refusal stated by type;
  Frenzy Rat HRT 05; the Volatile Shard and Battered Communicator have stated procedures; skill synthesis caps at +20
  and costs Aether at the highest source Grade; the HVE's world-response and adversarial lists cover all eight poles.
  0.1.16: at most one class per campaign carries a guarded power; the Kindler's poles are Force and Freedom; a boss
  already at Peak drops one meaningful item plus two bespoke drops; the app's 0.5 HVE entries are sweep reminders and
  add nothing unless the GM raises one to a full tally.
  0.1.17: no rule caps guarded powers; the book advises great care (one in a campaign is plenty), and the app and the
  AI-Assisted prompt offer one only when the GM asks.
