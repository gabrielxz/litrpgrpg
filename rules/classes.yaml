# Classes (18-classes.md). Sketched 2026-09-21 from the design record in
# 99-to-do.md; the chapter's tables render from here and the worked runs are
# fixtures. The numbers are the truth; the chapter's prose owns procedure.

selection:
  level: 10
  offers: 3
  refusable: false               # the same three stand until one is chosen; assigned points wait
  published: false               # inspection at any Grade does not show a class
  lead_attribute_bonus: 10       # added to the class's lead Attribute at selection, before Level 10's points land
  new_offers_at: the F→E Breakthrough
  opening_notice: "Level 10. Classification available. Three offers follow. One will be accepted; the others close."
  offer_notice: "Class offered: {name}."   # heads each offer's notice; the class's `notice` follows it

profile:
  system_points_per_level: 3     # Progression: 3 assigned + 2 free per level from Level 10
  shapes:
    - {shape: Fixed,  system: 3, returned: 0}
    - {shape: Guided, system: 2, returned: 1}
    - {shape: Open,   system: 1, returned: 2}
  # A profile lists its Attributes in order; the first named is the lead.

# A technique's `hook` is what the companion app applies itself: `clash` adds its bonus to a Clash
# on the named side (attack, defense, or either) when the technique is declared with it, and `heal`
# restores Health to a target within `reach` (zone, or adjacent: your Zone or the next). A technique
# without a hook has its cost paid by the app and its effect applied by the GM. `drawback` names which
# drawback a Drawback technique costs (health or exposed); `no_own_beat` and `reaction` mean it takes
# no Beat of its own.
technique:
  beats: 1
  aether_cost_at_f: 5            # ×10 per Grade of acquisition, like any acquired skill
  bonus_default: 10
  bonus_cap: 20                  # the Modifier Budget's peak
  cost_shapes:
    - {shape: Aether,    cost: "5 Aether, usable while Aether lasts",                    for: "Role tools: healing, casting, sensing"}
    - {shape: Frequency, cost: "No Aether, once per encounter",                          for: "Martial moves and reactions"}
    - {shape: Drawback,  cost: "No Aether; 10 Health, or Exposed until your next turn",  for: "Moves that cost the body"}
  drawback_health: 10
  reference:
    seed_application_heal: 20    # scales with the body
    class_heal: 10               # fixed
    seed_application_cost: 10
  constraint_clash: "HRT Force against HRT Force, one roll; none if the constraint rides an attack already won"

permission:
  cost: no Aether and no roll of its own; one that is a reaction or is paid in Beats follows those rules
  action_economy_effects_max: 1  # across the technique and the permission together
  reactions_per_encounter: 1     # a reaction paid in Beats (a shared Yield) is limited by the Beats instead
  once_a_day_resets: dawn        # a day runs from one dawn to the next where the character is
  dawn_hour: 6                   # the table's clock reads dawn at 06:00; the GM may set another hour where the party is
  death_clock_hold_rounds: 1     # the one thing a class may do to the countdown, for a Beat

guarded:
  per_campaign: advice          # offer with great care; one in a campaign is plenty (no rule caps it)
  app_generates: only when the GM asks
  list:
    - {power: "A killing blow restores 5 Aether, at most once per fight",                       changes: "Aether in combat", class: Devourer}
    - {power: "An attack on a higher-Grade target ignores 20 of its Cross-Grade Adjustment",   changes: "The Grade gap",    class: Underdog}
    - {power: "Against a higher-Grade target, Surge costs 5 (or the ordinary cost if lower)",  changes: "The Grade gap",    class: Underdog}

# The voice mapping: what the System's notice says, and what the table runs.
notice_vocabulary:
  - {system: "counts 10 higher",                     table: "+10 to the Clash (5 for +5)"}
  - {system: "one act",                              table: "1 Beat"}
  - {system: "takes no time",                        table: "costs no Beat"}
  - {system: "exchange",                             table: "turn"}
  - {system: "once per fight",                       table: "once per encounter"}
  - {system: "within reach",                         table: "in your Zone"}
  - {system: "on your ground or the ground beside it", table: "in your Zone or an adjacent one"}
  - {system: "ground",                               table: "a Zone"}
  - {system: "left open until it has acted again",   table: "Exposed until the end of its next turn"}
  - {system: "unless its Heart withstands yours",    table: "one Clash, its HRT Force against yours"}
  - {system: "holds the press",                      table: "has Momentum"}

classes:
  - name: Battle Medic
    built_for: Nia
    notice: "Care under threat. Triage: 5 Aether closes wounds on one ally within reach or on the ground beside you, restoring 10 Health. Reaching a fallen ally takes no time. Selection: Power +10. Growth: Power, Dexterity, Heart."
    poles: [Restraint, Accord]
    profile: {shape: Fixed, points: {POW: 1, DEX: 1, HRT: 1}}
    technique: {name: Triage, cost: Aether, effect: "Restores 10 Health to an ally in your Zone or an adjacent one", hook: {heal: 10, reach: adjacent}}
    permission: {name: Reach the Fallen, effect: "Moving into a Zone holding a Downed ally costs no Beat", action_economy: true}
  - name: Breaching Vanguard
    built_for: Kara
    notice: "First through. Breach: once per fight, the first blow after entering new ground lands with Strength counting 10 higher and carries the target back. Entering ground and striking there is one act. Selection: Strength +10. Growth: Strength, Strength, Fortitude."
    poles: [Force, Hunger]
    profile: {shape: Fixed, points: {STR: 2, FOR: 1}}
    technique: {name: Breach, cost: Frequency, effect: "+10 to a Clash against a target in a Zone you entered this turn; a win Drives it Back whatever the Margin", hook: {clash: 10, side: attack}}
    permission: {name: Rush, effect: "Moving into an adjacent Zone and attacking there costs 1 Beat in total", action_economy: true}
  - name: Burner
    built_for: Coleman
    notice: "Pay in Blood: 10 Health spent, and in the next blow, given or taken, your Attribute counts 10 higher. Blood may pay for what Aether pays for: a Surge for 10 Health. Selection: Strength +10. Growth: Strength, Fortitude, one point yours."
    poles: [Force, Hunger]
    profile: {shape: Guided, points: {STR: 1, FOR: 1}}
    technique: {name: Pay in Blood, cost: Drawback, drawback: health, effect: "Part of one Clash you roll this turn, attack or defense, declared before rolling; take 10 damage for +10", no_own_beat: true, hook: {clash: 10, side: either}}
    permission: {name: Blood for Aether, effect: "You may pay a Surge with 10 Health instead of Aether", action_economy: false}
  - name: Counterpuncher
    built_for: Ines
    notice: "Riposte: once per fight, a blow you turn well aside is answered at once, and the answer takes no time. While the other side holds the press, the first blow you throw in each exchange lands with its Attribute counting 5 higher. Selection: Dexterity +10. Growth: Dexterity, Perception, one point yours."
    poles: [Method, Restraint]
    profile: {shape: Guided, points: {DEX: 1, PER: 1}}
    technique: {name: Riposte, cost: Frequency, effect: "Win a defensive Clash by 20 or more and Clash back at once for no Beat", reaction: true}
    permission: {name: Second Hand, effect: "While your side lacks Momentum, the first Clash roll you make on your own turn is +5", action_economy: false}
  - name: Lightfingers
    built_for: Dani
    notice: "Lift: once per fight, one carried thing leaves an off-balance enemy within reach and arrives in your hand. Once a day, the remains of a kill you name yield more than expected. Selection: Dexterity +10. Growth: Dexterity, Perception, one point yours."
    poles: [Method, Hunger]
    profile: {shape: Guided, points: {DEX: 1, PER: 1}}
    technique: {name: Lift, cost: Frequency, effect: "Take one item an Exposed enemy in your Zone holds or carries; a held weapon counts, worn gear does not"}
    permission: {name: Finder's Share, effect: "Once a day, a kill you name rolls its loot one step up the table", action_economy: false, once_a_day: true}
  - name: Standing Surety
    built_for: Wendell
    notice: "Hold Fast: once a fight, and until your next act no one standing with you is cornered. A blow aimed at an ally beside you may be blunted by you, at the cost of your own next acts. Selection: Fortitude +10. Growth: Fortitude, Fortitude, Heart."
    poles: [Restraint, Accord]
    profile: {shape: Fixed, points: {FOR: 2, HRT: 1}}
    technique: {name: Hold Fast, cost: Frequency, effect: "Until your next turn, you and every ally in your Zone may Yield two Beats even with nowhere to be driven; the second Beat gives ground in place"}
    permission: {name: Take It, effect: "Once per round, after an ally in your Zone loses a Clash and before damage lands, give up one available Beat from your next turn to cut that Margin by 40; declared before the ally decides whether to Yield, and combines with it", action_economy: false, reaction: true, paid_in_beats: true, margin_cut: 40}
  - name: Vowbound
    built_for: Yusuf
    notice: "Sworn Blow: 5 Aether, and a blow against the object of your vow lands with its Attribute counting 10 higher. Speak one vow when a fight begins: what serves it is strengthened by 5, and acting against it leaves you open until the fight ends. Selection: Heart +10. Growth: Heart, Heart, Strength."
    poles: [Will, Restraint]
    profile: {shape: Fixed, points: {HRT: 2, STR: 1}}
    technique: {name: Sworn Blow, cost: Aether, effect: "+10 to a Clash against the object of your vow", hook: {clash: 10, side: attack}}
    permission: {name: The Vow, effect: "Swear one thing aloud at the start of a fight, naming an act or an object: +5 to Clashes that serve it; act against it and you are Exposed for the rest of the fight", action_economy: false}
  - name: Adjudicator
    built_for: Ruth
    notice: "Sanction: 5 Aether names an act. The next creature in sight that commits it is left open until it has acted again, unless its Heart withstands yours. One sanction stands at a time. Once per fight, a creature within reach of you that commits the sanctioned act draws your blow. Selection: Heart +10. Growth: Heart, Charisma, Perception."
    poles: [Will, Control]
    profile: {shape: Fixed, points: {HRT: 1, CHA: 1, PER: 1}}
    technique: {name: Sanction, cost: Aether, effect: "Name an action; the next creature in sight that takes it is Exposed until the end of its next turn unless it wins a Clash, HRT Force against yours; one Sanction at a time, expiring with the scene"}
    permission: {name: Contempt, effect: "Once per encounter, when a creature in your Zone takes the action your Sanction names, you Clash it at once for no Beat, after that action resolves", action_economy: true, reaction: true}
  - name: Peacemaker
    built_for: Hal
    notice: "Open Hand: 5 Aether. One enemy within reach at half its Health or less leaves the fight, or stands still through its next acts, as it chooses, unless its Heart withstands yours. What has no mind does not hear it. Anything that will give ground will also talk. Selection: Charisma +10. Growth: Charisma, Heart, one point yours."
    poles: [Accord, Freedom]
    profile: {shape: Guided, points: {CHA: 1, HRT: 1}}
    technique: {name: Open Hand, cost: Aether, effect: "One enemy in your Zone at half Health or less, its choice, leaves the fight or has no Beats on its next turn, unless it wins a Clash, HRT Force against yours; mindless creatures ignore it"}
    permission: {name: Terms, effect: "A creature whose stat block Yields can be parleyed with mid-fight", action_economy: false}
  - name: Registrar
    built_for: Maren
    notice: "Reclassify: 5 Aether, and one creature or object in sight is read again; its Grade, its danger, and one habit are stated as the record holds them. Once a day, a proposal you put to the System is heard and answered. Selection: Perception +10. Growth: Perception; the rest is yours."
    poles: [Control, Accord]
    profile: {shape: Open, points: {PER: 1}}
    technique: {name: Reclassify, cost: Aether, effect: "The System re-reads one creature or object in sight and returns the record's entry: Grade, tier, one Tactics line; exact for anything priced, wrong only where the record is"}
    permission: {name: Standing, effect: "Once a day, a proposal you put to the System receives an answer; Standing guarantees the audience, the answer is the System's", action_economy: false, once_a_day: true}
  - name: Still One
    built_for: Priya
    notice: "Go Cold: 5 Aether, and until your next act you are hard to find, and nothing that hunts by reading finds you at all. Do nothing, and the record shows no life in you until you move. Selection: Dexterity +10. Growth: Dexterity; the rest is yours."
    poles: [Freedom, Restraint]
    profile: {shape: Open, points: {DEX: 1}}
    technique: {name: Go Cold, cost: Aether, effect: "Until your next turn, a creature trying to find or target you must first win a Clash, PER Force against your DEX Force +10; a creature that hunts by the System's reading does not find you at all"}
    permission: {name: No Life Here, effect: "On a turn you spend no Beats, the System reads you as dead until you act: inspection returns nothing, titles included; the party frame is unaffected", action_economy: false}
  - name: Witness
    built_for: Sabine
    notice: "Note the Pattern: once per fight, after watching a creature through one exchange, its next act is known to you. Once per fight, at a death in your sight, the observation comes to you: Grade, danger, and one habit. Selection: Perception +10. Growth: Perception, Heart, one point yours."
    poles: [Method, Restraint]
    profile: {shape: Guided, points: {PER: 1, HRT: 1}}
    technique: {name: Note the Pattern, cost: Frequency, effect: "After one round watching a creature, the GM says what it does on its next turn"}
    permission: {name: The Observation, effect: "Once per encounter, when a creature dies in your sight, the System's observation comes to you: Grade, tier, one Tactics line", action_economy: false}
  - name: Kindler
    built_for: Oona
    notice: "Fire at a word. Cast Fire: 5 Aether, and flame leaves your hand for one target within reach or on the ground beside you, striking with Power in place of Strength; what burns, burns. What you set alight stays alight, and its ground hinders everyone but you. Selection: Power +10. Growth: Power, Power, Perception."
    poles: [Force, Freedom]
    profile: {shape: Fixed, points: {POW: 2, PER: 1}}
    technique: {name: Cast Fire, cost: Aether, effect: "A ranged attack on one target in your Zone or an adjacent one, rolled on POW Force in place of STR or DEX; damage as Margin; what burns catches"}
    permission: {name: Tinder, effect: "What you set alight stays alight through the scene; a burning Zone is a Hindering environment (−10) for everyone in it except you", action_economy: false}
  - name: Maker
    built_for: Bram
    notice: "Make Do: 5 Aether and one hour turn what is at hand into one remedy or one piece of gear the record lists. What lies in wreckage shows you what it could become. Selection: Perception +10. Growth: Perception, Dexterity, one point yours."
    poles: [Method, Control]
    profile: {shape: Guided, points: {PER: 1, DEX: 1}}
    technique: {name: Make Do, cost: Aether, effect: "One hour and 5 Aether, out of combat: turn the materials on hand into one Healing Pill up to the Healing Pill (30) or one piece of Scavenged Field Gear that those materials could yield; the GM says which; never an Aether Pill, a Foundation Pill, an Attribute Treasure, or a Volatile Artifact"}
    permission: {name: Salvage Eye, effect: "Looking at wreckage or parts, you know what it could become: the GM lists the pills and gear the materials on hand could yield", action_economy: false}
  - name: Devourer
    built_for: Aron
    notice: "What the fallen release is yours: once per fight, a death by your hand returns 5 Aether. The Health of what stands near you is visible to you. Selection: Power +10. Growth: Power, Strength, Heart."
    guarded: true
    poles: [Hunger, Will]
    profile: {shape: Fixed, points: {POW: 1, STR: 1, HRT: 1}}
    technique: {name: Consume, cost: Frequency, effect: "Your killing blow on a creature or a person, an execution included, restores 5 Aether, at most once per fight"}
    permission: {name: What Is Left, effect: "You read the current Health of every creature in your Zone (an exception to What Can Be Seen)", action_economy: false}
  - name: Underdog
    built_for: Tess
    notice: "Find the Seam: once per fight, a blow against what stands above you finds the gap. Against a greater Grade, the difference weighs 20 less; against greater strength of your own Grade, the blow lands harder. Against a greater Grade, a Surge costs no more than 5 Aether. Selection: Strength +10. Growth: Strength, Strength, Heart."
    guarded: true
    poles: [Force, Will]
    profile: {shape: Fixed, points: {STR: 2, HRT: 1}}
    technique: {name: Find the Seam, cost: Frequency, effect: "An attack on a higher-Grade target ignores 20 of its Cross-Grade Adjustment (guarded); against a target of your own Grade whose Force exceeds your attack's Force, +10"}
    permission: {name: Above You, effect: "Against a higher-Grade target, Surge costs 5, or your ordinary Surge cost if lower", action_economy: false}

# NPC classes print as a Tactics line: the class name and its one technique.
npc_tactics_example: "Class: Vowbound. Sworn Blow (5 Aether): +10 against the object of its vow, sworn aloud when the fight starts."

