# Characters: Attributes, point buy, derived stats, leveling budget, Backgrounds, Proficiencies, the pregens.
# source: 15-character-creation.md; 17-progression.md; 10-core-mechanics.md "Backgrounds", "Proficiencies"

attributes:
  - code: STR
    name: Strength
    governs: Physical power. Heavy melee, lifting, breaking, and feats of raw strength.
  - code: DEX
    name: Dexterity
    governs: Precision, speed, manual agility. Evasion, finesse melee, ranged attacks.
  - code: FOR
    name: Fortitude
    governs: Endurance and structural integrity. Health and standing your ground.
  - code: HRT
    name: Heart
    governs: Resolve and spiritual anchor. Momentum, defense against mental, spiritual, and coercive attacks, the Will Save against Aura Pressure, the Breakthrough.
  - code: POW
    name: Power
    governs: Supernatural output. Spells, Applications, the Aether pool.
  - code: PER
    name: Perception
    governs: Awareness and sensory sharpness. Detection, Principle insight, defense against illusion.
  - code: CHA
    name: Charisma
    governs: Force of personality and social leverage.

point_buy:
  points: 40
  min_per_stat: 3
  max_per_stat: 10

derived:
  max_hp: Raw FOR × 2
  max_aether: Raw POW
  ve_tolerance: cultivation.yaml tolerance (80 at F, ×10 per Grade)
  starting_level: 1
  starting_grade: F
  starting_ve: 0

sample_spreads:
  - {archetype: Brawler,             STR: 10, DEX: 6, FOR: 8, HRT: 4, POW: 3,  PER: 5,  CHA: 4}
  - {archetype: Scout,               STR: 4,  DEX: 9, FOR: 5, HRT: 4, POW: 3,  PER: 10, CHA: 5}
  - {archetype: Aspiring Cultivator, STR: 4,  DEX: 5, FOR: 5, HRT: 6, POW: 10, PER: 7,  CHA: 3}
  - {archetype: Natural Leader,      STR: 5,  DEX: 5, FOR: 5, HRT: 7, POW: 4,  PER: 5,  CHA: 9}
  - {archetype: Generalist,          STR: 6,  DEX: 6, FOR: 6, HRT: 6, POW: 6,  PER: 5,  CHA: 5}

# What a score means, in pre-Integration human terms. Even values sit between neighbors.
stat_anchors:
  scores: [3, 5, 7, 9, 10]
  labels: [deficiency, average, gifted, elite, peak human]
  STR: [Struggles with a full bucket, Carries the groceries in one trip, Moves furniture alone, College shot-putter, World-record deadlifter]
  DEX: [Drops what they carry, Catches keys tossed across a room, Amateur gymnast, Circus knife-thrower, Olympic-final gymnast]
  FOR: [Winded by one flight of stairs, Works a full shift on their feet, Runs marathons, Channel swimmer, Climbs Everest without bottled oxygen]
  HRT: [Folds under a raised voice, "Holds up in a crisis, shaken after", Steady hands in the ER, Hostage negotiator, Unbreakable under interrogation]
  POW: [Never notices the uncanny, Occasional gut feelings, Vivid dreams that sometimes land, The family everyone called witches, Lights flicker when they lose their temper]
  PER: [Misses the obvious, Notices a moved chair, Spots the tail on the drive home, Identifies birds by wingbeat, Counts the cards and the faces at once]
  CHA: [Empties a room slowly, Pleasant company, Closes the sale, Packs a town hall, Starts a movement]

leveling:
  points_per_level: 5
  system_assigned: 3            # by the GM from behavior before a class (Levels 2–9), by the class profile from Level 10
  free: 2
  scales_with_grade: true       # ×10 at E, ×100 at D, same 3-to-2 split
  points_can_wait: true         # unallocated until spent
  capped_stat_takes_no_allocation: true   # free points redirect; System points go to the next-best behavioral match
  class_level: 10
  class_options_default: 3
  class_lead_attribute_bonus: 10   # at selection; the class package lives in classes.yaml
  points_by_level_9:
    point_buy: 40
    system_assigned: 24         # 3 × 8 levels
    free: 16                    # 2 × 8 levels
    total: 80

# Pre-class stat assignment: the GM matches behavior since the last level.
behavioral_stat_mapping:
  - {behavior: "Solves problems with direct force, charges in",              primary: STR, secondary: FOR}
  - {behavior: "Plans ahead, positions carefully, uses finesse",             primary: DEX, secondary: PER}
  - {behavior: "Pursues power aggressively, takes risks for gain",           primary: POW, secondary: STR}
  - {behavior: "Shows restraint, endures hardship, holds the line",          primary: FOR, secondary: HRT}
  - {behavior: "Dominates socially, intimidates, commands",                  primary: CHA, secondary: STR}
  - {behavior: "Cooperates, negotiates, builds alliances",                   primary: CHA, secondary: HRT}
  - {behavior: "Imposes structure, creates systems, controls variables",     primary: PER, secondary: POW}
  - {behavior: "Breaks rules, improvises, embraces chaos",                   primary: DEX, secondary: POW}

# A Background is what the character did before Integration: one or two plain-language
# lines. No number, no Marks, no tiers. It never applies to an attack or a defense.
backgrounds:
  at_creation: one or two lines
  grants:
    - attempt work that needs training (surgery, an old script, rewiring a panel)
    - routine work in its field succeeds without a roll (Trivial and Easy checks at the character's own Grade)
    - Advantage on a check, or a Clash outside combat, that falls in its field
  never_applies_to: attack or defense rolls

sample_backgrounds:
  - {name: "ER nurse, twelve years", covers: "Wounds, triage, medication, and staying calm while someone is dying."}
  - {name: Volunteer firefighter, covers: "Rescue, first aid, fire, and working through the night without sleep."}
  - {name: Land surveyor, covers: "Maps, distances, reading terrain, and finding a boundary nobody marked."}
  - {name: Electrician, covers: "Wiring, power, circuits, and what will kill you if you touch it."}
  - {name: Auto mechanic, covers: "Engines, machines with moving parts, and making a thing run on the wrong part."}
  - {name: Hunting guide, covers: "Tracking, fieldcraft, weather, and living outdoors for days."}
  - {name: "Army infantry, four years", covers: "Small-unit tactics, weapons care, marching, and field first aid."}
  - {name: High school chemistry teacher, covers: "Reactions, solvents, lab safety, explosives, and a room full of teenagers."}
  - {name: Trial lawyer, covers: "Argument, reading a witness, and finding the weak point in a story."}
  - {name: Line cook, covers: "Knives, heat, timing, and feeding forty people from what is in the walk-in."}
  - {name: Locksmith, covers: "Locks, safes, alarms, and the habits of the people who install them."}
  - {name: Grad student in classics, covers: "Dead languages, old scripts, archives, and research."}
  - {name: Warehouse shift lead, covers: "Lifting and loading, forklifts, logistics, and keeping a crew working."}
  - {name: Ran with a crew, covers: "Black markets, rumor, lying well, and who to ask."}
  - {name: Street musician, covers: "Performance, holding a crowd, and reading who will pay."}

# Proficiencies are weapon training, tracked by the System. None at creation: the first Mark with a weapon shape
# grants its Proficiency at Trained (rules 0.1.19).
proficiencies:
  at_creation: 0
  tiers:
    - name: Trained
      bonus: 5
      marks_required: 1
    - name: Seasoned
      bonus: 10
      marks_required: 3
    - name: Master
      bonus: 10
      marks_required: 10
      requires_grade: E           # an F-Grade character banks Marks past 10 and advances at the Breakthrough
      free_action: once on your turn, the first action using the Proficiency costs no Beat
  untrained_bonus: 0
  mark_trigger: the die explodes on an attack or defense made with the domain's weapon shape
  weapons_carry_bonus: false      # the bonus is the wielder's tier

fighting_domains:
  - blades
  - axes and hammers
  - spears and staves
  - hand to hand
  - archery and throwing
  - firearms
fighting_domain_rules:
  anything_let_go_of: archery and throwing
  improvised_object: no domain; a thing with no weapon shape
  a_pipe_is_a_club: axes and hammers
  shield_proficiency: none

sample_proficiencies:
  Fighting:
    - {name: blades, covers: "Sword, knife, machete. An edge or a point, in one hand or two."}
    - {name: axes and hammers, covers: "Weight on a handle: battle axe, hatchet, maul, club, crowbar, a length of pipe."}
    - {name: spears and staves, covers: "Two-handed reach: spear, quarterstaff, polearm, scaffold pole."}
    - {name: hand to hand, covers: "Fists, grapples, throws, and every martial art."}
    - {name: archery and throwing, covers: "Bows, crossbows, slings, and anything you let go of."}
    - {name: firearms, covers: "Pistols, rifles, shotguns, and the System-forged weapons built on the same principle."}

# The book's recurring cast. Any worked example touching them must reconcile with these numbers.
pregens:
  - name: Kara
    level: 1
    grade: F
    tagline: "Warehouse shift lead. First through the door, and first to ask what it pays."
    stats: {STR: 8, DEX: 5, FOR: 7, HRT: 4, POW: 6, PER: 5, CHA: 5}
    proficiencies: []
    background: "Warehouse shift lead, eight years of lifting and loading; grew up on the east side and still knows who sells what."
    playing: "Fight close and end it fast. Want things out loud: the better weapon, the bigger bounty, the pill nobody else has claimed. Her generosity is real, and it is never first."
  - name: Joe
    level: 1
    grade: F
    tagline: "Volunteer firefighter. Hits hard so nobody else has to."
    stats: {STR: 8, DEX: 5, FOR: 7, HRT: 5, POW: 4, PER: 6, CHA: 5}
    proficiencies: []
    background: "Volunteer firefighter and EMT: rescue, first aid, and long nights without sleep."
    playing: "Stand between the danger and everyone else, and swing like the door needs breaking. He will take a bad trade if somebody weaker comes out ahead on it."
  - name: Andre
    level: 1
    grade: F
    tagline: "Land surveyor. Looks first, counts everything, and knows where the exits are."
    stats: {STR: 4, DEX: 7, FOR: 5, HRT: 6, POW: 5, PER: 9, CHA: 4}
    proficiencies: []
    background: "Land surveyor, and a deer hunter every fall since he was twelve: maps, terrain, tracking."
    playing: "Look before anyone moves, plan the way out before the way in, and take only what the plan needs. When the party gets loud, he is the one counting."

# Interpretation: the translation faculty every Integrant holds. No score, no tier, not on the sheet.
# source: 15-character-creation.md "Interpretation"; lore/setting.md "Interpretation"
interpretation:
  granted: at accession, to every Integrant
  translates: deliberately communicated messages (speech, sign, writing, recordings, the communicative gestures of an alien body), and the nonverbal features that carry the intended message
  directions: both directions of any conversation the holder is party to; one holder suffices
  outside_it: [unexpressed thoughts, motives, memories, the truth of a statement (a lie translates perfectly), involuntary emotional displays, cultural implications, computer protocols, expertise]
  exception: tutorial sectors built on old versions lack it; the party receives it at registration past the gate
