  - name: Cordon
    tier_group: Boss
    grade: F
    tier: Severe
    imprint: true
    hp: 120
    beats: 2
    hrt: 5
    per: 60
    offense: [{force: 60, stat: STR, means: the perimeter strike}]
    defense: [{force: 60, stat: FOR, means: construct body}]
