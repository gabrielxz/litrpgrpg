  - name: Completion
    tier_group: Boss
    grade: F
    tier: Peak
    imprint: true
    hp: 150
    beats: 3
    hrt: 5
    per: 75
    offense: [{force: 75, stat: STR, means: the region's strike}]
    defense: [{force: 75, stat: FOR, means: construct body}]
    yields: true
    tactics: "Mindless. Yields two of three Beats, keeping the third to strike. Runs the region's recorded conduct: its four lines are the ready default in After the Gate or the region's substitutions; meeting its stop condition clears it without a kill. Momentum on its PER. The completed diagram, taken a body."

# For an F-Grade party of 4.
encounter_sizing:
  - {party_level: "L1–3",   easy: "2 Trivial",  standard: "1 Easy + 1 Trivial",     hard: "1 Moderate or 2 Easy"}
  - {party_level: "L4–7",   easy: "2 Easy",     standard: "1 Moderate + 1 Easy",    hard: "1 Hard or 2 Moderate"}
  - {party_level: "L8–12",  easy: "One creature at Force 30",             standard: "One at Force 40, or two at 20", hard: "One at Force 50, or two at 30"}
  - {party_level: "L13–17", easy: "One at Force 40, or two at 20",        standard: "One at Force 50, or two at 30", hard: "One at Force 60, or two at 40"}
  - {party_level: "L18–22", easy: "One at Force 50, or two at 30",        standard: "One at Force 60, or two at 40", hard: "One at Force 70, or two at 50"}
  - {party_level: "L23–25", easy: "One at Force 60, or two at 40",        standard: "One at Force 70, or two at 50", hard: "One at Force 80, or two at 60"}
# From Level 8 the rows are in creature Force: Offense and Defense alike (the higher where they differ), Health twice it, two Beats.
# Calibrated 2026-09-22 with tools/class_sim.py, the tank Taking It only to stop a fall (a standard fight:
# whole-party loss about 1 in 100, a character on the floor in about 1 fight in 5; hard doubles both).
# A Surety who Takes It on every hit of 20 or more plays each row about one step easier.
encounter_guidance:
  peer_fight: equal Force
  tougher: +10 enemy Force
  second_creature_worth_force: 20   # two creatures at Force 30 fight like one at Force 50
  party_size_written_for: 4
  force_per_character: 10           # from Level 8: 10 Force less per character under four, 10 more per character over
  columns_per_character: 1          # every level: one column easier or harder per character; at Levels 1-7 in a group,
                                    # one creature of the lowest tier fewer or more (sims 2026-09-25, parties of 3 to 5)
  drags_past_round: 5
  yield_lengthens_by: about a third
