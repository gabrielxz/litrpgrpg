    tier_group: Trash
    grade: F
    tier: Trivial
    hp: 10
    beats: 1
    hrt: 5
    per: 4
    offense: [{force: 5, stat: DEX, means: sting}]
    defense: [{force: 8, stat: DEX, means: evasion}]
    yields: false
    tactics: "On a successful hit, target is Exposed until the end of their next turn (vision dazzle from bioluminescence)."
