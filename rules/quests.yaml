# System Quests and the Party.
# source: 55-quests.md

categories:
  - {name: Mandate,              issuer: System,   shape: "Server-wide directive binding on every Initiate in scope; story-driving; refusal has consequences."}
  - {name: Personal Opportunity, issuer: System,   shape: "Tailored to one behavioral signature from HVE state; affirms the pattern by default, tests it when Current and Deep disagree; cannot be shared."}
  - {name: Routine,              issuer: System,   shape: "Kill ten boars. Reliable, repeatable, video-gamey."}
  - {name: Hidden,               issuer: System,   shape: "No notification, or a deliberately unclear one; pairs with Hidden Achievement titles."}
  - {name: Faction,              issuer: NPCs,     shape: "Issued by people and organizations; the System tracks but does not generate; completion still feeds the HVE."}

party:
  invite: line of sight; accepting is a thought
  frame_shows: [current HP, Maximum HP, Aether, Downed]
  sharable: [Routine, Faction, Bestowed]
  not_sharable: [Mandate, Personal Opportunity]     # Mandates already bind everyone in scope
  shared_count_multiplies_by_holders: true          # "Eliminate ten" held by three becomes thirty; unscalable objectives stay as written
  rewards_per_holder: full award to every holder who meaningfully participated, at their own level
  ve_split: none

ve_policy:
  action_ve_and_completion_ve_both_apply: true
  completion_awarded_once: true
  farmable: false

difficulty_read_from: Grade Reference Card

# F-Grade baseline; ×10 per Grade. Hidden Quest rewards equal Personal Opportunity rewards at the tier.
ve_rewards:
  - {difficulty: Trivial,  routine: 3,  personal_opportunity: 5,   mandate: null, faction: 4}
  - {difficulty: Easy,     routine: 8,  personal_opportunity: 15,  mandate: 25,   faction: 12}
  - {difficulty: Moderate, routine: 15, personal_opportunity: 30,  mandate: 50,   faction: 25}
  - {difficulty: Hard,     routine: 30, personal_opportunity: 60,  mandate: 125,  faction: 50}
  - {difficulty: Severe,   routine: 50, personal_opportunity: 100, mandate: 250,  faction: 90}
  - {difficulty: Peak,     routine: 90, personal_opportunity: 175, mandate: 500,  faction: 150}

item_rewards:
  - {difficulty: Trivial,  typical: "1 Stuttering Tincture, or 5 currency, or a minor scavenge token."}
  - {difficulty: Easy,     typical: "1 Lesser Healing Pill, or a minor weapon, or a single skill shard."}
  - {difficulty: Moderate, typical: "1 Healing Pill + 1 Sparkstone Tablet, or a quality weapon, or a Resonance Glass."}
  - {difficulty: Hard,     typical: "1 Greater Healing Pill, or 2 skill shards, or a Foundation Pill (Dragon Marrow)."}
  - {difficulty: Severe,   typical: "1 Pristine Recovery Pill, or a single-use ranged relic, or a high-tier Foundation Pill (Nine Leaf Essence)."}
  - {difficulty: Peak,     typical: "A bespoke item generated by the System AI: a named weapon, a Quality Enhancer for breakthrough use, a Bestowed-tier consumable."}

refusal:
  single:
    - {type: Routine,              consequence: "Quest expires silently. No mechanical penalty."}
    - {type: Personal Opportunity, consequence: "The System notes the refusal. Similar offers may decrease in frequency."}
    - {type: Mandate,              consequence: "Behavioral reclassification, faction hostility, locked paths. Often a negative Bestowed title (\"Defiant,\" \"Mandate-Breaker\")."}
    - {type: Faction,              consequence: "Reputation drop with the issuing faction."}
    - {type: Hidden,               consequence: "The opportunity passes silently; the character usually never learns it existed."}
  repeated_personal_opportunity:
    half_frequency_after: 3
    stops_after: 6
  failure_softer_than_refusal: true

hidden_quest_modes: [Fully Obscured, Partial Reveal, Post-Completion Only]
quest_entry_fields: [id, title, issuer, grade, difficulty, objective, reward, time, status]
