# The rehearsal: a scene that spoils nothing in the tutorial, written to exercise the app's systems
# before real play (app/DESIGN.md, M3, "A rehearsal session"; the run sheet is rehearsal.md). Load it in
# Prep with "Load a pack from a file", record its setup once, then assign the four characters to
# players from the Party section. The setup is the record's own actions, as a script's setup is.
pack: rehearsal
title: "The rehearsal: past the depot fence"

# Four characters at Level 8, 100 of the 120 VE toward Level 9 refined, on Day 12 at 16:00.
setup:
  - {"id": "create-kara", "action": {"type": "character.pregen", "characterId": "kara", "pregen": "Kara"}}
  - {"id": "create-joe", "action": {"type": "character.pregen", "characterId": "joe", "pregen": "Joe"}}
  - {"id": "create-andre", "action": {"type": "character.pregen", "characterId": "andre", "pregen": "Andre"}}
