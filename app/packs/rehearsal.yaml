# The rehearsal: one hour of play that spoils nothing in the tutorial, written to see how the app
# holds up at a real table and to end on class offers (app/DESIGN.md, M3, "A rehearsal session"; the
# overview is rehearsal.md, the GM's step-by-step script rehearsal-run-sheet.html). Load it in Prep
# with "Load a pack from a file", record its setup once, then give the four characters to their
# players in the Table section's Who plays whom. The setup is the record's own actions.
pack: rehearsal
title: "The rehearsal: past the depot fence"

# Four characters at Level 9, 100 of the 120 VE toward Level 10 refined, on Day 12 at 16:00. One
# fight and one quest carry them past it at the rest, and the class offers follow.
setup:
  - {"id": "create-kara", "action": {"type": "character.pregen", "characterId": "kara", "pregen": "Kara"}}
  - {"id": "create-joe", "action": {"type": "character.pregen", "characterId": "joe", "pregen": "Joe"}}
  - {"id": "create-andre", "action": {"type": "character.pregen", "characterId": "andre", "pregen": "Andre"}}
