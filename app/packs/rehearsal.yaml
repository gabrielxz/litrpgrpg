  # What they carry, who they are to each other, and where they stand on Day 12.
  - {id: kit-kara, action: {type: item.give, to: kara, items: [{name: Battle Axe / Maul, count: 1}, {name: Reactive Buckler, count: 1}, {name: Healing Pill, count: 1}]}}
  - {id: kit-joe, action: {type: item.give, to: joe, items: [{name: Spear, count: 1}, {name: Battered Medkit, count: 1}, {name: Lesser Healing Pill, count: 2}]}}
  - {id: kit-andre, action: {type: item.give, to: andre, items: [{name: Short Bow, count: 1}, {name: Resonance Glass, count: 1}, {name: Veil Shard, count: 1}]}}
  - {id: kit-nia, action: {type: item.give, to: nia, items: [{name: Knife / Dagger, count: 1}, {name: Battered Medkit, count: 1}, {name: Sparkstone Tablet, count: 2}]}}
  - {id: invite-joe, action: {type: party.invite, fromId: kara, toId: joe}}
  - {id: joe-joins, action: {type: party.answer, inviteId: invite-joe, accept: true}}
  - {id: invite-andre, action: {type: party.invite, fromId: joe, toId: andre}}
  - {id: andre-joins, action: {type: party.answer, inviteId: invite-andre, accept: true}}
  - {id: invite-nia, action: {type: party.invite, fromId: andre, toId: nia}}
  - {id: nia-joins, action: {type: party.answer, inviteId: invite-nia, accept: true}}
  - {id: title-andre, action: {type: title.grant, characterId: andre, title: {catalog: Gate-Runner}}}
  - {id: title-kara, action: {type: title.grant, characterId: kara, title: {catalog: Wrong Key}}}
  # Principles: Andre's crystallized as Measure Twice; Joe's 1 short of crystallizing; Kara holds a card.
  # The class drafter reads them, with the Deep below, when it writes each character's offers.
  - {id: ip-andre, action: {type: insight.award, characterId: andre, source: "Any other Principle-aligned experience, GM's call", family: Architecture, ip: 3, note: Mapped the valley's exits before anyone moved}}
  - {id: name-andre, action: {type: principle.name, characterId: andre, family: Architecture, name: Measure Twice, passive: "+5 to checks that read ground or structure"}}
  - {id: ip-andre-2, action: {type: insight.award, characterId: andre, source: "Any other Principle-aligned experience, GM's call", family: Architecture, ip: 3, note: Brought the party through the flooded underpass by the map}}
  - {id: ip-andre-3, action: {type: insight.award, characterId: andre, source: "Any other Principle-aligned experience, GM's call", family: Architecture, ip: 2, note: Rigged the depot's shutter to drop behind them}}
  - {id: ip-joe, action: {type: insight.award, characterId: joe, source: "Any other Principle-aligned experience, GM's call", family: Preservation, ip: 2, note: Carried Ray out of the collapse}}
  - {id: card-kara, action: {type: memory.grant, characterId: kara, text: "The Alpha's jaws closed on the buckler instead of her throat"}}
  # Eleven days of play on the HVE sheet, so the offers have leads to read: Kara pushes and takes,
  # Joe gives way and gives up his share, Andre plans and sets the terms, Nia holds order and holds back.
  - {id: deep-kara, action: {type: hve.deep, characterId: kara, deep: {Force: 5, Hunger: 2, Will: 2, Freedom: 1}}}
  - {id: deep-joe, action: {type: hve.deep, characterId: joe, deep: {Restraint: 4, Accord: 3, Force: 2}}}
  - {id: deep-andre, action: {type: hve.deep, characterId: andre, deep: {Method: 5, Control: 2, Accord: 1}}}
  - {id: deep-nia, action: {type: hve.deep, characterId: nia, deep: {Control: 3, Restraint: 3, Method: 2}}}
  - {id: clock, action: {type: clock.set, day: 12, hour: 16, minute: 0}}

notices:
  - id: day-twelve
    group: "Scene 1: The gate"
    title: "Day 12: the status notice"
