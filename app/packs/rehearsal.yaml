  # Principles: Andre's crystallized and 2 short of Seed; Joe's 1 short of crystallizing; Kara holds a card to meditate on.
  - {id: ip-andre, action: {type: insight.award, characterId: andre, source: "Any other Principle-aligned experience, GM's call", family: Architecture, ip: 3, note: Mapped the valley's exits before anyone moved}}
  - {id: name-andre, action: {type: principle.name, characterId: andre, family: Architecture, name: Measure Twice, passive: "+5 to checks that read ground or structure"}}
  - {id: ip-andre-2, action: {type: insight.award, characterId: andre, source: "Any other Principle-aligned experience, GM's call", family: Architecture, ip: 3, note: Brought the party through the flooded underpass by the map}}
  - {id: ip-andre-3, action: {type: insight.award, characterId: andre, source: "Any other Principle-aligned experience, GM's call", family: Architecture, ip: 2, note: Rigged the depot's shutter to drop behind them}}
  - {id: ip-joe, action: {type: insight.award, characterId: joe, source: "Any other Principle-aligned experience, GM's call", family: Preservation, ip: 2, note: Carried Ray out of the collapse}}
  - {id: card-kara, action: {type: memory.grant, characterId: kara, text: "The Alpha's jaws closed on the buckler instead of her throat"}}
  - {id: clock, action: {type: clock.set, day: 12, hour: 16, minute: 0}}

notices:
  - id: day-twelve
    group: "Scene 1: The depot gate"
    title: "Day 12: the status notice"
    note: "Send to everyone at the start, before Mara speaks."
    text:
      - "Day 12 since Integration. Sector: Depot District."
      - "Initiates in range: 4. Local hostiles: present."
  - id: pattern
    group: "Scene 2: Past the fence"
    title: "Pattern detected"
    note: "To the one who spares a beaten creature for the second time, whether or not a Hidden quest goes out."
    text:
      - "Pattern detected. Monitoring."
  - id: building
    group: "Scene 3: The lit building"
    title: "Structure scan"
    note: "To whoever steps into the lot first."
    text:
      - "Structure: municipal records annex. Power: partial. Occupancy: 3 human, 1 construct."
  - id: terminal
    group: "Scene 5: The terminal"
    title: "Fragment detected"
    note: "At the terminal, after the Mandate. Read it aloud."
    text:
      - "Data fragment detected. Coherence: failing. Containment: none."
      - "It has noticed you."

quests:
  - group: "Scene 1: The depot gate"
    note: "When the Snarljaws are in sight. Issue to one character; the holder shares it with the party."
    quest: {id: Q-201, category: Routine, title: Fence Line Clearance, issuer: System, grade: F, difficulty: Easy,
            objective: "Eliminate the Snarljaws at the depot fence.", count: 3, countFixed: true, time: Open.}
  - group: "Scene 1: The depot gate"
    note: "Mara's request, if the listener does not draft it: to the character she asked, then shared. Severe, because a construct holds the three in the annex; set it Severe if the listener drafts it lower."
    quest: {id: Q-202, category: Faction, title: Bring Them Home, issuer: Mara, grade: F, difficulty: Severe,
            objective: "Find Mara's grandson and the two who went past the fence with him, and bring them home.", count: 3, countFixed: true,
            rewardText: "Mara's gratitude, and the co-op's."}
  - group: "Scene 2: Past the fence"
    note: "Fully obscured, to the first character who spares a beaten creature. Reveal it partially the second time (the listener may draft the reveal)."
    quest: {id: Q-HID-01, category: Hidden, title: Spare the Beaten, issuer: System, grade: F, difficulty: Moderate,
            objective: "Let what is done fighting go.", hidden: obscured}
  - group: "Scene 5: The terminal"
    note: "Read it aloud and set the time. Failure: the fragment spreads through the district's power, and the annex goes dark with the three inside."
    quest: {id: M-01, category: Mandate, title: "Fragment Containment: Records Annex", issuer: System, grade: F, difficulty: Hard,
            objective: "Destroy the data fragment at the annex terminal before it propagates.", hours: 2,
            rewardText: "District power restored. Continued Integration."}

encounters:
  - id: fence
    group: "Scene 1: The depot gate"
    title: "The fence line: three Snarljaws"
    note: "Standard for four at Level 8 (one at Force 40, or two at 20: three Snarljaws). Pack-Breaker waits for whoever kills all three. One Snarljaw that is beaten and backs away tests the Hidden quest."
    zones: [The gate, The fence line, The yard]
    creatures: [{creature: Snarljaw, count: 3}]
  - id: lot
    group: "Scene 3: The lit building"
    title: "The lot: the Alpha"
    note: "Optional. Hard. If the party is short of the VE for Level 10, this fight is 20 more each."
    zones: [The lot, The loading dock]
    creatures: [{creature: Alpha Snarljaw}]
  - id: sentinel
    group: "Scene 3: The lit building"
