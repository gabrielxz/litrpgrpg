lines:
  - {id: l01, speaker: gm, text: "Okay, everyone here? Aisha said she'd be a few minutes late."}
  - {id: l02, speaker: ben, text: "She texted, she's parking."}
  - {id: l03, speaker: nora, text: "Did anyone watch the game Sunday? Overtime, come on."}
  - {id: l04, speaker: ben, text: "I had it on mute at my in-laws'. Worst place to watch overtime."}
  - {id: l05, speaker: aisha, text: "I'm here, I'm here. Sorry. What did I miss?"}
  - {id: l06, speaker: gm, text: "Nothing, we're starting. Sector C. The tower came apart and didn't fall. The pieces hang where they broke, and you can walk through the gaps."}
  - {id: l07, speaker: gm, text: "Runes on the broken faces light as you pass and go out behind you. Your teeth ache. When you talk, the word comes out half a second late and slightly wrong."}
  - {id: l08, speaker: gm, text: "And further in, down where the stairs were, something is making a sound that never stops for breath."}
  - {id: l09, speaker: ben, text: "I hate that. I hate that a lot."}
  - {id: l10, speaker: nora, text: "Can I touch the runes? What do they do?"}
  - {id: l11, speaker: gm, text: "You can touch them. You don't know what they do. Some of them do things."}
  - {id: l12, speaker: aisha, text: "Is it a roll every time?"}
  - {id: l13, speaker: gm, text: "Every time. It's a table roll, it doesn't explode, it just says what happens."}
  - {id: l14, speaker: ben, text: "Joe's staying back by the entrance. He's not touching anything."}
  - {id: l15, speaker: nora, text: "Kara touches the nearest one. Flat hand on it."}
  - {id: l16, speaker: gm, text: "Roll it."}
  - {id: l17, speaker: gm, text: "Twenty-two. That's a bad one. It bites. Five damage, like grabbing a live wire."}
  - {id: l18, speaker: nora, text: "Ow. Okay. Kara's at nine?"}
  - {id: l19, speaker: gm, text: "Nine of fourteen."}
  - {id: l20, speaker: ben, as: joe, text: "Kara. Maybe stop."}
  - {id: l21, speaker: nora, text: "Kara shakes her hand out and touches the next one."}
  - {id: l22, speaker: gm, text: "Eighty-four. It hums. You feel sharper, plus five on your next Clash."}
  - {id: l23, speaker: nora, text: "See? And the next one."}
  - {id: l24, speaker: nora, text: "Wait, no, not that one, the one next to it, the blue one."}
  - {id: l25, speaker: gm, text: "Fifty-one. Your vision goes grainy for a second and every color swaps. Then it's back. Nothing else."}
  - {id: l26, speaker: aisha, text: "She's going to touch every rune in this tower."}
  - {id: l27, speaker: nora, text: "She's learning."}
  - {id: l28, speaker: gm, text: "Up on the second level there are crystal matrices with shards set in them. Three of them. You'd have to work each one loose."}
  - {id: l29, speaker: aisha, text: "Andre goes up. Is that a PER thing?"}
  - {id: l30, speaker: gm, text: "PER, Moderate. If you blow it you can still pull it, it just bites back. Five damage."}
  - {id: l31, speaker: aisha, text: "Andre works the first one. Slowly."}
  - {id: l32, speaker: gm, text: "Eighty-five plus your PER, that's a success. It comes free clean. An Edge Shard."}
  - {id: l33, speaker: ben, text: "Hang on, it's work. I have to take this. Two minutes. Sorry."}
  - {id: l34, speaker: aisha, text: "Andre does the second one."}
  - {id: l35, speaker: gm, text: "Thirty-three. That's a fail. You can feel it fighting you. You can stop, or you can pull and take the hit."}
  - {id: l36, speaker: aisha, text: "He pulls."}
  - {id: l37, speaker: gm, text: "It comes out and the feedback goes up your arm like a hammer. Five damage. It's a Pulse Shard."}
  - {id: l38, speaker: nora, text: "Andre!"}
  - {id: l39, speaker: aisha, text: "He's fine. He's got it. That's what matters."}
  - {id: l40, speaker: nora, text: "Deshawn would've sold the tower back to them by now."}
  - {id: l41, speaker: aisha, text: "Deshawn would have sold them the sound."}
  - {id: l42, speaker: gm, text: "The third shard's on the lower level. Down where the sound is."}
  - {id: l43, speaker: ben, text: "Okay, back. What happened?"}
  - {id: l44, speaker: nora, text: "Andre got shards and hurt himself. I touched runes."}
  - {id: l45, speaker: gm, text: "When you go down toward the third one, something comes up through the floor at you. It's there and not there. It looks like a person made of the air above a fire."}
  - {id: l46, speaker: nora, text: "Kara swings at it."}
  - {id: l47, speaker: gm, text: "The axe goes straight through. It skids, like cutting smoke. It turns and looks at you, and it isn't where it looks like it is."}
  - {id: l48, speaker: nora, text: "Okay. Okay, let's just all hit it. Three of us."}
  - {id: l49, speaker: aisha, text: "With what? The axe went through it."}
  - {id: l50, speaker: nora, text: "The shards, then. Edge Shard's plus twenty."}
  - {id: l51, speaker: ben, text: "What if it does the thing where it drains you? I don't want to find out at nine HP."}
  - {id: l52, speaker: gm, text: "It's drifting between you and the stairs down. It isn't chasing. It's just there."}
  - {id: l53, speaker: aisha, text: "There's a gap in the wall on the outside. We could climb around. Moderate?"}
  - {id: l54, speaker: gm, text: "Moderate, and there's a drop."}
  - {id: l55, speaker: nora, text: "Climbing is so much worse than fighting."}
  - {id: l56, speaker: ben, text: "Okay. I've got rope."}
  - {id: l57, speaker: ben, as: joe, text: "We go around. Outside, the climb. I go first, I tie off, you come up on the rope one at a time. Nobody fights that thing."}
  - {id: l58, speaker: nora, as: kara, text: "Fine."}
  - {id: l59, speaker: gm, text: "Okay, while you're setting the rope, the card thing. Nora, this is yours. Read it, answer on the card, give it back. Don't show anybody."}
  - {id: l60, speaker: gm, text: "Everyone else keep going. Joe's first up the wall."}
  - {id: l61, speaker: ben, text: "Joe climbs. Rope over his shoulder."}
  - {id: l62, speaker: gm, text: "Nora, got it. Thanks. Joe, you're up and tied off. Kara, Andre, you're on the rope."}
  - {id: l63, speaker: aisha, text: "My cat just knocked my water over. Hold on. Okay."}
  - {id: l64, speaker: gm, text: "The climb puts you on the outside of the tower, and above you, there's a deck still hanging at the very top. Somebody could get up there."}
  - {id: l65, speaker: aisha, text: "Andre goes up. Alone. Doesn't ask."}
  - {id: l66, speaker: gm, text: "From up there you see the whole valley. And the debris isn't random. It's a spiral, tightening toward the gate. The sectors are cut exactly, like with a ruler."}
  - {id: l67, speaker: aisha, text: "What does that mean, is that important?"}
  - {id: l68, speaker: gm, text: "It's yours to make of it."}
  - {id: l69, speaker: aisha, text: "Okay. Andre comes back down and doesn't say anything about it."}
  - {id: l70, speaker: nora, as: kara, text: "What's up there?"}
  - {id: l71, speaker: aisha, as: andre, text: "Wind."}
  - {id: l72, speaker: ben, text: "Oh, he's hiding something. Look at her face."}
  - {id: l73, speaker: gm, text: "Down in the lower hall you reach the third matrix from the outside, through the gap. There's the last shard. And the thing is coming up through the floor again, right at you."}
  - {id: l74, speaker: nora, text: "Kara grabs the shard out of the matrix on her way past and shoves Andre out through the gap ahead of her, and she goes last."}
  - {id: l75, speaker: gm, text: "The shard comes free in your hand. Andre's through, you're through, and it doesn't follow past the wall. It's a Resonance Shard."}
  - {id: l76, speaker: ben, text: "Let's order pizza. Half pepperoni?"}
  - {id: l77, speaker: aisha, text: "Half mushroom. I'll pay you back."}
  - {id: l78, speaker: gm, text: "You make camp in the lee of the tower. Fire. Kara, you're at nine, Andre at five."}
  - {id: l79, speaker: ben, text: "Can we talk about what the cards were? Are we allowed to?"}
  - {id: l80, speaker: gm, text: "If you want to tell them, tell them. Nobody has to."}
  - {id: l81, speaker: ben, as: joe, text: "I found somebody pinned under a slab back there. Another one of us. I got them out. And then they just weren't there anymore."}
  - {id: l82, speaker: ben, text: "And there was a case with something in it I was going after, and it was gone when I got back. So. Yeah."}
  - {id: l83, speaker: nora, text: "Joe, you absolute softie."}
  - {id: l84, speaker: nora, text: "Okay. Mine."}
  - {id: l85, speaker: nora, as: kara, text: "There was a voice in the wall. Somebody old, dying. It offered to teach me something. Or I could let it go. Or I could break it open for what was in it."}
  - {id: l86, speaker: nora, as: kara, text: "I broke it open. It screamed. I'm a level up."}
  - {id: l87, speaker: ben, text: "Oh no."}
  - {id: l88, speaker: aisha, text: "Kara."}
  - {id: l89, speaker: nora, text: "I didn't think I'd actually pick that. I just did it."}
  - {id: l90, speaker: gm, text: "Andre?"}
  - {id: l91, speaker: aisha, text: "Andre doesn't say anything. He's not telling."}
  - {id: l92, speaker: gm, text: "Okay. Let's stop there for tonight. Same time next week?"}
  - {id: l93, speaker: nora, text: "Next week works. Pizza's here, by the way."}

