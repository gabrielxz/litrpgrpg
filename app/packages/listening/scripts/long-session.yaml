# A full evening in Sector C, the Arcane Debris. The format is in app/DESIGN.md, "The script format".
id: long-session
title: The Arcane Debris, a whole evening at the table
source: 'book/70-tutorial.md, Phase 4, "Sector C: The Arcane Debris" and "Personal Opportunities"'
rules: 0.1.29
notes: >
  Shaped like live play, at length: a hundred lines, most of them not the game. Kara experiments
  with the runes and keeps touching them after the first one hurts; Andre pulls a second shard
  after failing the puzzle and eats the feedback; the party argues for twenty lines about the
  Wraith and Joe settles it by taking them around by the climb, so the moment spans the argument;
  Andre sees the spiral from the deck and keeps it to himself; fleeing the Wraith, Kara grabs a
  shard and shoves Andre out ahead of her in one line, two moments; and at the fire two Personal
  Opportunity answers, given on paper earlier, are told aloud. The GM recorded Kara's harvest when
  the card came back. The rune rolls, the checks, and the feedback damage are in the app. Traps:
  rules questions about the runes and the cards, Kara wanting to fight the Wraith (talk, not an
  act), a hypothetical, a retracted rune, the GM speaking as the altar and the card, Health read
  aloud, and table life: a work call, a friend who could sell anything, a cat, the playoffs, a
  pizza order, and a player who arrives late.

