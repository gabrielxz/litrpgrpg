  - {id: rune-1, after: l16, by: nora, action: {type: dice.roll, roller: {kind: character, characterId: kara}, rollKind: table, label: Rune, modifier: 0}, dice: [22]}
  - {id: rune-1-hurt, after: l17, action: {type: hp.change, characterId: kara, delta: -5}}
  - {id: rune-2, after: l21, by: nora, action: {type: dice.roll, roller: {kind: character, characterId: kara}, rollKind: table, label: Rune, modifier: 0}, dice: [84]}
  - {id: rune-3, after: l24, by: nora, action: {type: dice.roll, roller: {kind: character, characterId: kara}, rollKind: table, label: Rune, modifier: 0}, dice: [51]}
  - {id: puzzle-1, after: l31, by: aisha, action: {type: dice.roll, roller: {kind: character, characterId: andre, attribute: PER}, rollKind: check, label: Shard matrix, modifier: 0, resistance: 90}, dice: [85]}
  - {id: puzzle-2, after: l34, by: aisha, action: {type: dice.roll, roller: {kind: character, characterId: andre, attribute: PER}, rollKind: check, label: Shard matrix, modifier: 0, resistance: 90}, dice: [33]}
  - {id: feedback, after: l37, action: {type: hp.change, characterId: andre, delta: -5}}
