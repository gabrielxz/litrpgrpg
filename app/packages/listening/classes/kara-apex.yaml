  - {id: deep, action: {type: hve.deep, characterId: kara, deep: {Force: 6, Hunger: 4, Will: 2, Accord: 1}}}
  - {id: heart, action: {type: event.log, summary: Kara kills the smallest young Snarljaw for the Heart inside it and eats it., participants: [kara], entries: [{characterId: kara, pole: Hunger, intensity: 3, intent: Take the Heart}]}}
  - {id: den, action: {type: event.log, summary: Kara goes into the den first while one adult guards it., participants: [kara], entries: [{characterId: kara, pole: Force, intensity: 2}]}}
  - id: sweep
    action:
      type: hve.sweep
      label: Session 5
      sheets: [{characterId: kara, moments: [{pole: Hunger, weight: 3, eventId: heart, note: The table went quiet when she ate it.}, {pole: Force, weight: 2, eventId: den}]}]
characterId: kara
keepsDoing: First through every door, and she says out loud which piece of the loot she wants before the fight is over.
expected:
  anyLead: [STR, POW]
