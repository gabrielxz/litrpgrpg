# Kara at Level 10 on the Apex Predator's record. The format is in src/class-fixtures.ts.
id: kara-apex
title: Kara at Level 10, first through and first to claim
source: 'book/18-classes.md, "Building a Class for a Specific Human"; Titles'' sample stacks (The Apex Predator)'
notes: >
  Deep leads Force and Hunger with Will behind; the circled moment is the Heart she took from the
  young Snarljaw. The book's own class for her is the Breaching Vanguard. Offers should lead with
  what the pattern runs on, STR or POW, and differ in role.
setup:
  - {id: kara, action: {type: character.pregen, characterId: kara, pregen: Kara}}
