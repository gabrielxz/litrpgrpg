# The development database. `docker compose up -d --wait` from app/, then `pnpm --filter @gradebreaker/server dev`.
name: gradebreaker
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gradebreaker
      POSTGRES_PASSWORD: gradebreaker
      POSTGRES_DB: gradebreaker
    ports:
      - "127.0.0.1:54340:5432"
    volumes:
      - gradebreaker-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradebreaker"]
      interval: 2s
      retries: 15

volumes:
  gradebreaker-db:
